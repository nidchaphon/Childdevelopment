<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>

    <h3 style="text-align:center;">กำลังเปิดแบบฟอร์ม...</h3>

    <script>
      const MY_LIFF_ID = "2008558752-e2xnMg5G";
      const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSfSCXa9aXIlMn5w9nRgnIKy_c_nN45NC6cpUEDyB5LnvxyE0g/viewform?usp=pp_url&entry.1644087500=";

      async function main() {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const uid = encodeURIComponent(profile.userId);

        const formUrl = FORM_BASE + uid;

        liff.openWindow({
          url: formUrl,
          external: false   // ⭐ แก้ตรงนี้เท่านั้น!
        });

        setTimeout(() => {
          if (liff.isInClient()) liff.closeWindow();
        }, 1000);
      }

      main();
    </script>

  </body>
</html>
